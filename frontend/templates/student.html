<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Complaint Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 px-8 py-6">
            <h1 class="text-2xl font-bold text-white mb-2">Hostel Complaint Portal</h1>
            <p class="text-blue-100 text-sm">Submit your maintenance request for automated routing.</p>
        </div>

        <!-- Form -->
        <div class="px-8 py-8 space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="John Doe">
            </div>

            <div>
                <label for="student_id" class="block text-sm font-medium text-gray-700 mb-1">Student ID (Optional)</label>
                <input type="text" id="student_id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="e.g., 21BBS001">
            </div>

            <div>
                <label for="complaint" class="block text-sm font-medium text-gray-700 mb-1">Complaint Description</label>
                <textarea id="complaint" rows="5" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Example: The lights are flickering in my room and the AC is giving off heat instead of cooling."></textarea>
                <p class="text-xs text-gray-500 mt-1">Please be detailed. Min 5 words.</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Model Type</label>
                <div class="flex space-x-4">
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="model" value="ML" checked class="text-blue-600 focus:ring-blue-500">
                        <span class="text-sm text-gray-700">Machine Learning (Linear)</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="model" value="DL" class="text-blue-600 focus:ring-blue-500">
                        <span class="text-sm text-gray-700">Deep Learning (LSTM)</span>
                    </label>
                </div>
            </div>

            <button onclick="submitComplaint()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 transform hover:scale-[1.01] active:scale-[0.99] shadow-md">
                Submit Complaint
            </button>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="resultModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 transform transition-all scale-100">
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-4">
                    <svg class="h-8 w-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <h3 class="text-lg font-bold text-gray-900 mb-2">Complaint Received!</h3>
                <p class="text-sm text-gray-500 mb-6">Your ticket has been processed and routed.</p>
                
                <div class="bg-gray-50 rounded-lg p-4 text-left space-y-3 mb-6 border border-gray-100">
                    <div class="flex justify-between">
                        <span class="text-sm font-medium text-gray-500">Ticket ID</span>
                        <span class="text-sm font-bold text-gray-900" id="ticketId">#--</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-sm font-medium text-gray-500">Assigned Team</span>
                        <span class="text-sm font-bold text-blue-600" id="assignedTeam">--</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-sm font-medium text-gray-500">Routing Status</span>
                        <span class="text-xs font-bold px-2 py-1 rounded bg-blue-100 text-blue-800" id="routingStatus">--</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-sm font-medium text-gray-500">Urgency</span>
                        <span class="text-sm font-bold text-gray-900 uppercase" id="urgencyLevel">--</span>
                    </div>
                </div>

                <div class="flex space-x-3">
                    <button onclick="closeModal()" class="flex-1 bg-white border border-gray-300 text-gray-700 font-medium py-2 rounded-lg hover:bg-gray-50 transition">Close</button>
                    <a href="/admin" class="flex-1 bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition flex items-center justify-center">View in Admin</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Error/Loading Toast (Simplified as alert for MVP) -->

    <script>
        async function submitComplaint() {
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerText;
            
            // Get values
            const name = document.getElementById('name').value;
            const student_id = document.getElementById('student_id').value;
            const text = document.getElementById('complaint').value;
            const model = document.querySelector('input[name="model"]:checked').value;
            
            if(!text.trim()) {
                alert("Please enter a complaint.");
                return;
            }

            // Loading state
            btn.disabled = true;
            btn.innerText = "Processing AI Analysis...";
            
            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_name: name || "Anonymous",
                        student_id: student_id,
                        text: text,
                        model_type: model
                    })
                });
                
                const result = await response.json();
                
                if(response.ok) {
                    // Populate Modal
                    document.getElementById('ticketId').innerText = "#" + result.data.id;
                    document.getElementById('assignedTeam').innerText = result.data.team;
                    document.getElementById('routingStatus').innerText = result.data.decision;
                    document.getElementById('urgencyLevel').innerText = result.data.urgency;
                    
                    // Show Modal
                    document.getElementById('resultModal').classList.remove('hidden');
                    
                    // Clear form
                    document.getElementById('complaint').value = "";
                } else {
                    alert(`Error: ${result.message}`);
                }
            } catch (err) {
                alert("Something went wrong. check console.");
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }
        
        function closeModal() {
            document.getElementById('resultModal').classList.add('hidden');
        }
    </script>
</body>
</html>
